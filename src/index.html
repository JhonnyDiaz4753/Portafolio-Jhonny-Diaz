<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portafolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><circle cx='24' cy='24' r='22' stroke='%23667eea' stroke-width='2.5' fill='none'/><text x='24' y='30' font-family='system-ui' font-size='18' font-weight='700' fill='%23667eea' text-anchor='middle'>JDC</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<script>
  // Runs before Angular loads to avoid a flash of the wrong theme.
  // Mirrors the logic in ThemeService (localStorage 'theme' key, then OS preference).
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    } catch (e) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>

</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
  <div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">   
  <app-root ></app-root>
</div>
</body>
</html>
