<header class="site-header">
  <div class="header-shell">
    <a class="brand" href="#inicio" aria-label="Jhonny Diaz Centeno, inicio" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">JD</span>
      <span class="brand-copy">
        <span class="brand-name">Jhonny Diaz</span>
        <span class="brand-role">DESARROLLADOR FULL STACK</span>
      </span>
    </a>

    <nav class="desktop-nav" aria-label="Navegación principal">
      <a href="#inicio">Inicio</a>
      <a href="#sobre-mi">Sobre mí</a>
      <a href="#proyectos">Proyectos</a>
      <a href="#habilidades">Habilidades</a>
      <a href="#contacto">Contacto</a>
    </nav>

    <div class="header-actions">
      <button
        type="button"
        class="icon-button theme-button"
        (click)="toggleTheme()"
        [attr.aria-label]="isDarkMode() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      >
        <svg *ngIf="isDarkMode()" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
        </svg>
        <svg *ngIf="!isDarkMode()" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path>
        </svg>
      </button>

      <button type="button" class="button-primary cv-button" (click)="downloadCV()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3"></path>
        </svg>
        <span>Descargar CV</span>
      </button>

      <button
        type="button"
        class="icon-button menu-button"
        (click)="toggleMenu()"
        [attr.aria-label]="isMenuOpen ? 'Cerrar menú' : 'Abrir menú'"
        [attr.aria-expanded]="isMenuOpen"
        aria-controls="mobile-navigation"
      >
        <svg *ngIf="!isMenuOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"></path>
        </svg>
        <svg *ngIf="isMenuOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"></path>
        </svg>
      </button>
    </div>
  </div>

  <nav
    id="mobile-navigation"
    class="mobile-nav"
    [class.is-open]="isMenuOpen"
    [attr.aria-hidden]="!isMenuOpen"
    aria-label="Navegación móvil"
  >
    <a href="#inicio" (click)="closeMenu()">Inicio</a>
    <a href="#sobre-mi" (click)="closeMenu()">Sobre mí</a>
    <a href="#proyectos" (click)="closeMenu()">Proyectos</a>
    <a href="#habilidades" (click)="closeMenu()">Habilidades</a>
    <a href="#contacto" (click)="closeMenu()">Contacto</a>
    <button type="button" class="button-primary mobile-cv-button" (click)="downloadCV(); closeMenu()">
      Descargar CV
    </button>
  </nav>
</header>
