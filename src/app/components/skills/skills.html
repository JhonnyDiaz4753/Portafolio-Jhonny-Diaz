<section id="habilidades" class="portfolio-section skills-section" appReveal>
  <div class="section-kicker">Herramientas de trabajo</div>
  <h2 class="section-heading">Tecnologías que utilizo</h2>
  <p class="skills-intro">
    Un stack flexible para crear aplicaciones web desde el frontend hasta la base de datos y el
    despliegue.
  </p>
  <div class="skills-grid">
    @for (skill of skills; track skill.name) {
      <div class="skill-card">
        <span class="skill-icon">
          <img [src]="skill.iconUrl" [alt]="''" loading="lazy" />
        </span>
        <span>{{ skill.name }}</span>
      </div>
    }
  </div>
</section>
